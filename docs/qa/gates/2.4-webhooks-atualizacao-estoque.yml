top_issues:
  - id: 'REL-001'
    severity: medium
    finding: 'WebhookEvent criado antes de processOrderPaid/processOrderCancelled. Se o processamento falha com exceção (ex: DB timeout), retorna 500 mas o evento fica marcado como processado. Na retry da Shopify, a checagem de idempotência retorna 200 sem processar — estoque não é atualizado.'
    suggested_action: 'Envolver WebhookEvent.create + processamento em transação, ou mover o create para após o processamento bem-sucedido. Prioridade: pós-MVP.'
